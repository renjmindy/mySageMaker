version: "3.9"

services:
  nlp-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nlp-topic-api:latest
    container_name: nlp-topic-api
    ports:
      - "8001:8001"
    environment:
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
