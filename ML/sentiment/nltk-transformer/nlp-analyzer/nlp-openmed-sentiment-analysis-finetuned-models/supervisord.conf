[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/app/supervisord.pid

; ── OpenMed PII De-identification API ─────────────────────────────────────────
[program:pii-api]
command=uvicorn api.main:app --host 0.0.0.0 --port 8001
directory=/app/pii
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── NLP Sentiment Analysis API ────────────────────────────────────────────────
[program:nlp-api]
command=uvicorn api.main:app --host 0.0.0.0 --port 8000
directory=/app/nlp
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
