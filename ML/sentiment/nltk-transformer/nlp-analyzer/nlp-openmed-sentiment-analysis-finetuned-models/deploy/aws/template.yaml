AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NLP Sentiment Analysis API - AWS Lambda Deployment

Globals:
  Function:
    Timeout: 900            # 15 min — largest HC model cold-start needs headroom
    MemorySize: 4096        # 4 GB — largest model (BART MNLI zero-shot) needs ~2 GB headroom
    Environment:
      Variables:
        NLTK_DATA:              /var/task/nltk_data
        HF_HOME:                /var/task/.cache/huggingface
        TRANSFORMERS_CACHE:     /var/task/.cache/huggingface
        OPENMED_PII_BASE_URL:   !Ref OpenMedPiiBaseUrl
        OPENMED_PII_API_KEY:    !Ref OpenMedPiiApiKey

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod

  OpenMedPiiBaseUrl:
    Type: String
    Default: https://08cnjcgfxg.execute-api.ap-southeast-2.amazonaws.com/prod
    Description: Base URL of the OpenMed PII de-identification API

  OpenMedPiiApiKey:
    Type: String
    Default: amCRZA8wjA54tyEbYaGOV9qNAGUPlcNm7ylTd8Kg
    NoEcho: true
    Description: x-api-key for the OpenMed PII de-identification API

Resources:

  SentimentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:   !Sub nlp-hc-sentiment-${Stage}
      PackageType:    Image
      ImageUri:       !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/nlp-hc-sentiment:latest
      Description:    NLP OpenMed Sentiment Analysis — 13 Transformer models (6 HC fine-tuned + 7 pretrained) via FastAPI
      Architectures:  [x86_64]
      EphemeralStorage:
        Size: 2048
      Events:
        ApiRoot:
          Type: Api
          Properties:
            Path:      /
            Method:    ANY
            RestApiId: !Ref SentimentApi
        ApiProxy:
          Type: Api
          Properties:
            Path:      /{proxy+}
            Method:    ANY
            RestApiId: !Ref SentimentApi
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'

  SentimentApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:        !Sub nlp-hc-sentiment-api-${Stage}
      StageName:   !Ref Stage
      Description: NLP Sentiment Analysis REST API
      Auth:
        ApiKeyRequired: true        # All routes require X-Api-Key header
        UsagePlan:
          CreateUsagePlan: PER_API  # SAM creates ApiKey + UsagePlan + UsagePlanKey
          Description:    !Sub "NLP Sentiment API — 50 rps / 10 000 req/day (${Stage})"
          Quota:
            Limit:  10000
            Period: DAY
          Throttle:
            RateLimit:  50
            BurstLimit: 100
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin:  "'*'"

  SentimentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:    !Sub /aws/lambda/nlp-hc-sentiment-${Stage}
      RetentionInDays: 7

  # ── Keep-warm: ping all 13 models every 5 minutes to prevent cold starts ─────
  # EventBridge max 5 targets per rule — 13 models split across 3 rules (5 + 5 + 3)
  WarmupRule:
    Type: AWS::Events::Rule
    Properties:
      Name:               !Sub nlp-hc-sentiment-warmup-${Stage}
      Description:        Warms bert_hc_v2 / distilroberta_hc_v2 / distilbert_hc_v2 / bert_hc / distilbert_hc
      ScheduleExpression: rate(5 minutes)
      State:              ENABLED
      Targets:
        - Id:  WarmBertHcV2
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-bert-hc-v2","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"bert_hc_v2\"}","isBase64Encoded":false}'
        - Id:  WarmDistilrobertaHcV2
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-distilroberta-hc-v2","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"distilroberta_hc_v2\"}","isBase64Encoded":false}'
        - Id:  WarmDistilbertHcV2
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-distilbert-hc-v2","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"distilbert_hc_v2\"}","isBase64Encoded":false}'
        - Id:  WarmBertHc
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-bert-hc","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"bert_hc\"}","isBase64Encoded":false}'
        - Id:  WarmDistilbertHc
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-distilbert-hc","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"distilbert_hc\"}","isBase64Encoded":false}'

  WarmupRule2:
    Type: AWS::Events::Rule
    Properties:
      Name:               !Sub nlp-hc-sentiment-warmup2-${Stage}
      Description:        Warms distilroberta_hc / default / roberta / emotion / amazon
      ScheduleExpression: rate(5 minutes)
      State:              ENABLED
      Targets:
        - Id:  WarmDistilrobertaHc
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-distilroberta-hc","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"distilroberta_hc\"}","isBase64Encoded":false}'
        - Id:  WarmDefault
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-default","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"default\"}","isBase64Encoded":false}'
        - Id:  WarmRoberta
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-roberta","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"roberta\"}","isBase64Encoded":false}'
        - Id:  WarmEmotion
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-emotion","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"emotion\"}","isBase64Encoded":false}'
        - Id:  WarmAmazon
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-amazon","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"amazon\"}","isBase64Encoded":false}'

  WarmupRule3:
    Type: AWS::Events::Rule
    Properties:
      Name:               !Sub nlp-hc-sentiment-warmup3-${Stage}
      Description:        Warms twitter / sst2 / zeroshot
      ScheduleExpression: rate(5 minutes)
      State:              ENABLED
      Targets:
        - Id:  WarmTwitter
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-twitter","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"twitter\"}","isBase64Encoded":false}'
        - Id:  WarmSst2
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-sst2","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"sst2\"}","isBase64Encoded":false}'
        - Id:  WarmZeroshot
          Arn: !GetAtt SentimentFunction.Arn
          Input: '{"version":"1.0","resource":"/api/v1/analyze","httpMethod":"POST","path":"/api/v1/analyze","headers":{"Content-Type":"application/json","Host":"localhost"},"multiValueHeaders":{"Content-Type":["application/json"],"Host":["localhost"]},"queryStringParameters":null,"multiValueQueryStringParameters":null,"requestContext":{"resourcePath":"/api/v1/analyze","httpMethod":"POST","path":"/prod/api/v1/analyze","protocol":"HTTP/1.1","requestId":"warmup-zeroshot","stage":"prod","identity":{"sourceIp":"127.0.0.1","userAgent":"warmup-scheduler"},"apiId":"warmup"},"body":"{\"text\":\"keeping model warm for fast inference\",\"model_type\":\"zeroshot\"}","isBase64Encoded":false}'

  WarmupPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SentimentFunction
      Action:       lambda:InvokeFunction
      Principal:    events.amazonaws.com
      SourceArn:    !GetAtt WarmupRule.Arn

  WarmupPermission2:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SentimentFunction
      Action:       lambda:InvokeFunction
      Principal:    events.amazonaws.com
      SourceArn:    !GetAtt WarmupRule2.Arn

  WarmupPermission3:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SentimentFunction
      Action:       lambda:InvokeFunction
      Principal:    events.amazonaws.com
      SourceArn:    !GetAtt WarmupRule3.Arn

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL (include X-Api-Key header on every request)
    Value: !Sub https://${SentimentApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  RetrieveApiKeyCommand:
    Description: Run after deploy to get the plaintext API key value
    Value: !Sub >-
      aws apigateway get-api-keys
      --region ${AWS::Region}
      --include-values
      --query "items[?contains(name,'nlp-sentiment')].{name:name,value:value}"
      --output table

  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt SentimentFunction.Arn

  FunctionName:
    Description: Lambda Function Name
    Value: !Ref SentimentFunction
